<?xml version="1.0" encoding="UTF-8"?>
<!--
  kladde.svg - das Blatt, und das Blatt daneben.

  Zwei Blätter, weil Blättern hier eine Seite hereinschiebt und nicht das
  ganze Bild ersetzt: das hintere Blatt ist die Nachbarseite. Kein Text und
  keine Rundungen, die in 48x48 verschwinden - ein Icon wird auch auf dem
  Telefon klein.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Kladde</title>
  <defs>
    <linearGradient id="blatt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ec"/>
    </linearGradient>
  </defs>

  <!-- Das hintere Blatt: die Nachbarseite, die beim Blättern einschiebt.
       Es schaut links und oben heraus, deshalb liegt es links. -->
  <rect x="24" y="20" width="66" height="86" rx="7" fill="#94a3b8"/>

  <!-- Das vordere Blatt, rechte obere Ecke umgeknickt. -->
  <path d="M48 28 h40 l16 16 v58 a7 7 0 0 1 -7 7 h-49 a7 7 0 0 1 -7 -7 v-67 a7 7 0 0 1 7 -7 z"
        fill="url(#blatt)" stroke="#52637a" stroke-width="3" stroke-linejoin="round"/>
  <!-- Der Knick selbst: von der Ecke ein Stück nach unten und zurück. -->
  <path d="M88 28 v10 a6 6 0 0 0 6 6 h10"
        fill="none" stroke="#52637a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Drei Zeilen Text. Deren Länge ist Absicht: die letzte ist kürzer,
       das liest sich als Absatz und nicht als Gitter. -->
  <g fill="#9aa7b8">
    <rect x="53" y="58" width="38" height="5" rx="2.5"/>
    <rect x="53" y="70" width="38" height="5" rx="2.5"/>
    <rect x="53" y="82" width="24" height="5" rx="2.5"/>
  </g>
</svg>
